openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: inspection
    description: Payload inspection operations
  - name: audit
    description: Security audit operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create a TrustLens account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid registration
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in to TrustLens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
  /inspect/analyze:
    post:
      operationId: analyzePayload
      tags: [inspection]
      summary: Inspect and redact a payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspectionInput"
      responses:
        "200":
          description: Inspection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionResult"
        "400":
          description: Invalid payload
  /audit/logs:
    get:
      operationId: getAuditLogs
      tags: [audit]
      summary: List recent inspection audit logs
      parameters:
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [ALL, LOW, MEDIUM, HIGH, CRITICAL]
      responses:
        "200":
          description: Audit log list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
  /audit/stats:
    get:
      operationId: getAuditStats
      tags: [audit]
      summary: Get dashboard audit metrics
      responses:
        "200":
          description: Audit statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditStats"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RegisterInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required: [email, password]
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]
    AuthUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
      required: [id, email]
    AuthSession:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/AuthUser"
      required: [token, user]
    InspectionInput:
      type: object
      properties:
        payloadText:
          type: string
          minLength: 1
      required: [payloadText]
    Threat:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        confidence:
          type: integer
          minimum: 0
          maximum: 100
        rationale:
          type: string
        compliance:
          type: array
          items:
            type: string
      required: [type, value, severity, confidence, rationale, compliance]
    InspectionResult:
      type: object
      properties:
        id:
          type: integer
        sanitizedText:
          type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        privacyScore:
          type: integer
          minimum: 0
          maximum: 100
        threats:
          type: array
          items:
            $ref: "#/components/schemas/Threat"
        rationale:
          type: string
        compliance:
          type: array
          items:
            type: string
        processingTimeMs:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
      required: [id, sanitizedText, severity, privacyScore, threats, rationale, compliance, processingTimeMs, createdAt]
    AuditLog:
      type: object
      properties:
        id:
          type: integer
        preview:
          type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        threatCount:
          type: integer
        piiCount:
          type: integer
        privacyScore:
          type: integer
          minimum: 0
          maximum: 100
        processingTimeMs:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
      required: [id, preview, severity, threatCount, piiCount, privacyScore, processingTimeMs, createdAt]
    AuditStats:
      type: object
      properties:
        totalScans:
          type: integer
        piiIntercepted:
          type: integer
        riskScore:
          type: integer
        averagePrivacyScore:
          type: integer
        protectedPercent:
          type: integer
        severityCounts:
          type: object
          properties:
            LOW: { type: integer }
            MEDIUM: { type: integer }
            HIGH: { type: integer }
            CRITICAL: { type: integer }
          required: [LOW, MEDIUM, HIGH, CRITICAL]
        timeline:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              scans: { type: integer }
              risk: { type: integer }
            required: [label, scans, risk]
      required: [totalScans, piiIntercepted, riskScore, averagePrivacyScore, protectedPercent, severityCounts, timeline]

